<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7f3f98">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>บันทึกงานเปลี่ยนมิเตอร์ชำรุด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pu:#7f3f98;--pu-d:#5e2c73;--gold:#b58d3a;--bg:#f6f2f8;--card:#fff;--tx:#241a2b;--mu:#6d6275;--bd:#d9cfe0;--ok:#1f7a4d;--er:#b3261e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 Sarabun,system-ui,sans-serif;padding-bottom:110px}
header{background:var(--pu);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;display:flex;gap:12px;align-items:center;border-bottom:4px solid var(--gold)}
header img{width:52px;height:52px}
header h1{font-size:18px;margin:0;line-height:1.25}
header p{margin:0;font-size:14px;opacity:.9}
main{max-width:640px;margin:0 auto;padding:12px}
fieldset{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--pu);border-radius:10px;margin:0 0 14px;padding:12px 14px 6px}
legend{font-weight:700;color:var(--pu-d);padding:0 6px;font-size:18px}
label{display:block;font-size:15px;color:var(--mu);margin:0 0 10px}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;color:var(--tx);padding:11px 12px;margin-top:3px;border:1.5px solid var(--bd);border-radius:8px;background:#fff;min-height:48px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 0 8px;border:1.5px solid var(--bd);border-radius:8px;color:var(--tx);font-size:17px;min-height:48px}
.chk input{width:24px;height:24px;accent-color:var(--pu);flex:none}
.chk:has(input:checked){background:#f0e4f6;border-color:var(--pu)}
.sig{border:1.5px dashed var(--pu);border-radius:8px;background:#fff;touch-action:none;width:100%;height:150px;display:block}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font-size:14px;color:var(--mu)}
.sigbar button{background:none;border:1px solid var(--bd);border-radius:6px;padding:6px 12px;font:inherit;color:var(--pu-d)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:10px;max-width:none}
.bar button{flex:1;min-height:52px;border-radius:10px;border:0;font:700 18px Sarabun,sans-serif}
#save{background:var(--pu);color:#fff;flex:2}
#clear{background:#ece5f0;color:var(--pu-d)}
#msg{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:9;padding:12px 14px;border-radius:10px;color:#fff;font-weight:600;display:none}
#pend{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:#fff4d6;border:1px solid var(--gold);display:none;font-size:15px}
#pend button{margin-left:8px;padding:6px 12px;border-radius:6px;border:1px solid var(--gold);background:#fff;font:inherit}
.hide{display:none}

.bar button{font-size:16px}
#prev{background:#f3e9d2;color:#6b4e12;flex:2}
#pv{position:fixed;inset:0;z-index:20;background:#3a3040;display:none;flex-direction:column}
#pvTop{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;font-weight:700}
#pvTop button{background:none;border:1px solid #fff8;color:#fff;border-radius:8px;padding:8px 14px;font:inherit}
#pvBody{flex:1;overflow:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
#pvWrap{margin:0 auto;background:#fff;box-shadow:0 2px 12px #0008;overflow:hidden}
#pvBot{display:flex;gap:10px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:#fff}
#pvBot button{flex:1;min-height:52px;border:0;border-radius:10px;font:700 17px Sarabun,sans-serif}
#dl{background:var(--pu);color:#fff}#sh{background:#ece5f0;color:var(--pu-d)}
#off{position:fixed;left:-9999px;top:0}
.pg{width:794px;height:1123px;background:#fff;color:#000;padding:26px 85px 0 77px;font:16px/24px Sarabun,sans-serif;position:relative;overflow:hidden}
.pg .ln{display:flex;align-items:flex-start;height:30px;white-space:nowrap}
.pg .ln>*{flex:none}
.pg .t{padding:0 3px;line-height:24px}
.pg .f{flex:1 1 0;min-width:0;height:25px;line-height:24px;border-bottom:1.5px dotted #222;text-align:center;font-weight:600;overflow:hidden;position:relative}
.pg .bx{display:inline-block;width:34px;text-align:center}
.pg .ck{display:inline-block;width:20px;font-weight:700}
.pg .sr{height:46px;align-items:flex-end}
.pg .sg{position:absolute;left:50%;bottom:-2px;height:74px;max-width:300px;object-fit:contain;transform:translateX(-50%);z-index:5}
.pg .c{text-align:center;white-space:nowrap}

#fnW{display:flex;align-items:center;gap:6px;padding:10px 12px 0;background:#fff}
#fnW input{flex:1;min-width:0;font:inherit;padding:9px 10px;border:1.5px solid var(--bd);border-radius:8px}
#fnW span{color:var(--mu)}
#lastW{display:none;margin:0 0 14px}
#lastW button{width:100%;min-height:46px;border-radius:10px;border:1.5px solid var(--gold);background:#fff;color:#6b4e12;font:600 16px Sarabun,sans-serif}
</style>
</head>

<script>
// ===== ตั้งค่า: ใส่ URL ของ Apps Script (Web app) ที่นี่ =====
const API_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";
// ==========================================================
const $=s=>document.querySelector(s), f=$('#f');
const Q='pea_queue';
const loadQ=()=>{try{return JSON.parse(localStorage.getItem(Q)||'[]')}catch(e){return[]}};
const saveQ=q=>{try{localStorage.setItem(Q,JSON.stringify(q))}catch(e){}};

function toast(t,ok){const m=$('#msg');m.textContent=t;m.style.background=ok?'var(--ok)':'var(--er)';m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',3500)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
$('#d').value=today();
$('#oth').onchange=e=>$('#othW').classList.toggle('hide',!e.target.checked);
document.querySelectorAll('[name=ค่าใช้จ่าย]').forEach(r=>r.onchange=()=>$('#payW').classList.toggle('hide',!$('#pay').checked));

// ผู้ตรวจสอบ: จำชื่อไว้ใช้ครั้งถัดไป
try{$('#insp').value=localStorage.getItem('pea_insp')||''}catch(e){}

// ===== ลายเซ็น =====
const pads={};
function pad(id){
  const c=$('#'+id),x=c.getContext('2d');let dr=false,dirty=false;
  function size(){const r=c.getBoundingClientRect(),k=2;c.width=r.width*k;c.height=r.height*k;x.scale(k,k);x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#241a2b';dirty=false}
  size();
  const p=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{dr=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
  c.onpointermove=e=>{if(!dr)return;x.lineTo(...p(e));x.stroke();dirty=true};
  c.onpointerup=()=>dr=false;
  pads[id]={clear:()=>{x.clearRect(0,0,c.width,c.height);dirty=false},data:()=>{
    if(!dirty)return '';
    const w=c.width,h=c.height,d=x.getImageData(0,0,w,h).data;let a=w,b=h,e=0,g=0;
    for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(d[(j*w+i)*4+3]>10){if(i<a)a=i;if(i>e)e=i;if(j<b)b=j;if(j>g)g=j}
    if(e<a)return '';const m=8;a=Math.max(0,a-m);b=Math.max(0,b-m);e=Math.min(w-1,e+m);g=Math.min(h-1,g+m);
    const t=document.createElement('canvas');t.width=e-a+1;t.height=g-b+1;
    t.getContext('2d').drawImage(c,a,b,t.width,t.height,0,0,t.width,t.height);return t.toDataURL('image/png')}};
}

function collect(){
  const o={};
  new FormData(f).forEach((v,k)=>{ if(k==='ชำรุด')return; o[k]=v });
  o['ชำรุด']=[...f.querySelectorAll('[name=ชำรุด]:checked')].map(i=>i.value).join(', ');
  o['ลายเซ็นผู้ใช้ไฟ']=pads.s1.data();
  o['ลายเซ็นผู้ตรวจสอบ']=pads.s2.data();
  o['id']=Date.now()+'-'+Math.random().toString(36).slice(2,6);
  const [y,m,d]=(o['วันที่ตรวจสอบ']||'').split('-');
  o['วันที่ตรวจสอบ(พ.ศ.)']=y?`${+d}/${+m}/${+y+543}`:'';
  return o;
}
async function send(o){
  if(API_URL.startsWith('PASTE'))throw new Error('ยังไม่ได้ตั้งค่า API_URL');
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});
  let j;try{j=await r.json()}catch(e){throw new Error('Apps Script ตอบกลับผิดปกติ (ตรวจสอบสิทธิ์ Anyone และ URL /exec)')}
  if(!j||!j.ok)throw new Error((j&&j.error)||'Apps Script ผิดพลาด');
}
function pend(){const n=loadQ().length;$('#pend').style.display=n?'block':'none';$('#pendTxt').textContent=`ค้างส่ง ${n} รายการ`}
async function flush(){
  let q=loadQ(),left=[];
  for(const o of q){try{await send(o)}catch(e){left.push(o)}}
  saveQ(left);pend();
  return q.length-left.length;
}

let curRec=null;
function fitFields(root){root.querySelectorAll('.f').forEach(e=>{e.style.fontSize='';let z=16;while(e.scrollWidth>e.clientWidth+1&&z>8){z-=0.5;e.style.fontSize=z+'px'}})}

function fitPreview(){
  const sc=Math.min(innerWidth-24,794)/794,w=$('#pvWrap'),i=$('#pvIn');
  i.style.transform=`scale(${sc})`;w.style.width=794*sc+'px';w.style.height=1123*sc+'px';

async function makePdf(){
  if(!window.html2canvas||!window.jspdf)throw new Error('lib');
  await (document.fonts&&document.fonts.ready);
  const off=$('#off');off.innerHTML=pdfHtml(curRec);fitFields(off);
  const cv=await html2canvas(off.firstElementChild,{scale:2,useCORS:true,backgroundColor:'#fff'});
  off.innerHTML='';
  const pdf=new jspdf.jsPDF({unit:'mm',format:'a4'});
  pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
  const name=`มิเตอร์ชำรุด_${curRec['หมายเลขผู้ใช้ไฟ']||'ไม่ระบุ'}_${curRec['วันที่ตรวจสอบ']||today()}.pdf`;
  return {blob:pdf.output('blob'),name,pdf};
}
async function runPdf(share){
  const b=share?$('#sh'):$('#dl'),t=b.textContent;b.disabled=true;b.textContent='กำลังสร้าง PDF…';
  const nm=(($('#fn').value||'').trim().replace(/[\\/:*?"<>|]/g,'_')||'เอกสาร')+'.pdf';
  try{
    const r=await makePdf();
    if(share){
      const file=new File([r.blob],nm,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:nm});
      else{r.pdf.save(nm);toast('เครื่องนี้แชร์ไฟล์ไม่ได้ ดาวน์โหลดให้แทน',true)}
    }else{r.pdf.save(nm);toast('ดาวน์โหลด PDF แล้ว',true)}
  }catch(e){if(e.name!=='AbortError')toast('สร้าง PDF ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่',false)}
  b.disabled=false;b.textContent=t;
}
$('#dl').onclick=()=>runPdf(false);
$('#sh').onclick=()=>runPdf(true);
